name: Numerical quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-and-oracles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install attitude oracle
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Configure strict C build
        run: |
          cmake -S . -B build/strict \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build and test accepted dynamics
        run: |
          cmake --build build/strict --parallel
          ctest --test-dir build/strict --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure instrumented C build
        run: |
          cmake -S . -B build/sanitize \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build and run native dynamics fixtures
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          cmake --build build/sanitize --parallel
          ./build/sanitize/tests/test_physics_model
          ./build/sanitize/tests/test_numerical_solvers
